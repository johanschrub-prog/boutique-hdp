<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Boutique HDP</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

body{
font-family:Segoe UI,sans-serif;
margin:0;
background:#f5f6f8;
}

header{
background:#0a66ff;
color:white;
padding:15px;
text-align:center;
}

.toolbar{
position:sticky;
top:0;
z-index:1000;
background:white;
padding:10px;
display:flex;
flex-wrap:wrap;
gap:10px;
border-bottom:1px solid #ddd;
}

.cards{
padding:10px;
display:grid;
gap:10px;
}

.card{
background:white;
padding:15px;
border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,.15);
}

.resumeOk{
background:#fff3a3;
}

.qtyInput{
width:120px;
padding:10px;
font-size:20px;
}

button{
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
}

</style>

</head>

<body>

<header id="titreApp">
<h2>BOUTIQUE HDP</h2>
</header>

<div id="toolbarActions" class="toolbar">

<input
id="search"
placeholder="Rechercher..."
onkeyup="render()">

<button onclick="addArticle()">
➕ Ajouter
</button>

<button onclick="resetStock()">
🔄 Remise à zéro
</button>

<button onclick="exportExcel()">
📤 Export Excel
</button>

<input
type="file"
id="importFile"
style="display:none"
onchange="importExcel(event)">

<button
onclick="document.getElementById('importFile').click()">
📥 Import Excel
</button>

<button onclick="toggleResume()">
📋 Résumé
</button>

</div>

<div id="cards" class="cards"></div>

<script src="app.js"></script>

</body>
</html>
